name: Publish Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build -f backend/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-backend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-backend:${{ github.sha }} \
            .

      - name: Build frontend image
        run: |
          docker build -f frontend/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-frontend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-frontend:${{ github.sha }} \
            .

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-backend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-frontend:${{ github.sha }}

      - name: Update Kubernetes image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("k8s/kustomization.yaml")
          text = path.read_text()

          lines = text.splitlines()
          result = []

          for line in lines:
              if line.strip().startswith("newTag:"):
                  indentation = line[:len(line) - len(line.lstrip())]
                  result.append(f"{indentation}newTag: {os.environ['IMAGE_TAG']}")
              else:
                  result.append(line)

          path.write_text("\n".join(result) + "\n")
          PY

      - name: Commit Kubernetes image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No image tag changes to commit."
            exit 0
          fi

          git commit -m "chore: deploy images for ${{ github.sha }}"
          git push
          