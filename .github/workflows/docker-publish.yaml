name: Publish Docker Images

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build -f backend/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-backend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-backend:${{ github.sha }} \
            .

      - name: Build frontend image
        run: |
          docker build -f frontend/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-frontend:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-frontend:${{ github.sha }} \
            .

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-backend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pulsewatch-frontend:${{ github.sha }}