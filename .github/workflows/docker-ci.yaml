name: Docker CI

on:
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t pulsewatch-backend:test .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t pulsewatch-frontend:test .