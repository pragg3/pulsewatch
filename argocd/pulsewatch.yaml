apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: pulsewatch
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/pragg3/pulsewatch.git
    targetRevision: feature/gitops
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true