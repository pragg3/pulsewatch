apiVersion: apps/v1
kind: Deployment

metadata:
  name: pulsewatch-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: pulsewatch-backend

  template:
    metadata:
      labels:
        app: pulsewatch-backend

    spec:
      containers:
        - name: backend
          image: pragg3/pulsewatch-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10