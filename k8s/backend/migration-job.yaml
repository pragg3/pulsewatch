apiVersion: batch/v1
kind: Job

metadata:
  name: pulsewatch-migrate

spec:
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migrate
          image: pragg3/pulsewatch-backend:latest
          imagePullPolicy: Always

          command:
            - alembic
            - -c
            - backend/alembic.ini
            - upgrade
            - head

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL

  backoffLimit: 3