apiVersion: apps/v1
kind: Deployment

metadata:
  name: pulsewatch-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: pulsewatch-frontend

  template:
    metadata:
      labels:
        app: pulsewatch-frontend

    spec:
      containers:
        - name: frontend
          image: pragg3/pulsewatch-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10